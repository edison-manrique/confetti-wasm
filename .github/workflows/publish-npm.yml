name: Publish confetti-wasm to npm (OIDC Trusted Publishing)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (npm >= 11.5.1 required for OIDC Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build WASM, run tests & typecheck
        run: |
          npm run build:wasm
          npm test
          npm run lint

      - name: Sync repository metadata for npm provenance
        run: |
          npm pkg set repository.type=git
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"

      - name: Build publishable library bundle (dist-lib/)
        run: npm run build:lib

      - name: Dry-run package tarball
        run: npm pack --dry-run

      - name: Publish to npm via OIDC Trusted Publishing
        run: npm publish --access public
